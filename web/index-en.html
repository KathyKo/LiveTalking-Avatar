    <style>

        body {

            padding: 8px 16px;
            cursor: pointer;

        .btn-primary-custom:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(67,97,238,0.3); color: #fff; }

        .btn-danger-custom { background: #ef4444; border: none; color: #fff; font-weight: 600; border-radius: 8px; padding: 8px 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-danger-custom:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(239,68,68,0.3); }
        .btn-danger-custom:active { transform: translateY(0); }
        .btn-outline-custom { border: 2px solid var(--primary); color: var(--primary); font-weight: 600; border-radius: 8px; padding: 8px 16px; background: transparent; cursor: pointer; transition: all 0.2s; }

        .btn-sm.btn-primary-custom, .btn-sm.btn-outline-custom { padding: 5px 10px; font-size: 0.8rem; }
        .btn-sm.btn-primary-custom i, .btn-sm.btn-outline-custom i { font-size: 0.8rem; }
        video { width: 100%; border-radius: 8px; background: #000; }
        .session-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; }
        .connected { background: #d1fae5; color: #065f46; }

        .status-dot.off { background: #ef4444; }

        .quick-link .glass-card { transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
        .quick-link:hover .glass-card { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.1); }
        label { font-weight: 500; font-size: 0.9rem; color: #64748b; margin-bottom: 4px; }
        .param-hint { font-size: 0.75rem; color: #94a3b8; }
        ::placeholder { color: #9ca3af !important; opacity: 1; }
        :-ms-input-placeholder { color: #9ca3af; }

        .chat-user { background: #4361ee; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }

        .avatar-stage { position: relative; display: flex; flex: 1; min-height: 0; align-items: stretch; justify-content: center; overflow: hidden; }

        .avatar-selector {

            box-shadow: none;
            transition: border-color 0.2s, box-shadow 0.2s;

        .chat-toolbar { flex: 0 0 66px; display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid #e5e7eb; background: #fff; }

            border-color: var(--primary);

        .avatar-selector > i { color: var(--primary); font-size: 1rem; }
        #avatarSelect {
            width: 210px;
            min-width: 0;
            padding-top: 5px;
            padding-bottom: 5px;
            border: 0;
            background-color: transparent;
            color: #1e293b;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none;
        }
        #avatarSelect:focus { box-shadow: none; }
        #btnMic { flex: 0 0 42px; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 50%; background: #1597e5; color: #fff; font-size: 1.1rem; cursor: pointer; box-shadow: 0 3px 10px rgba(21,151,229,0.28); transition: background 0.2s, transform 0.2s, box-shadow 0.2s; }
        #btnMic:hover { background: #087fc4; transform: translateY(-1px); }
        #btnMic:active { transform: translateY(0); }
        #btnMic.listening { background: #ef4444; box-shadow: 0 0 0 5px rgba(239,68,68,0.14); }
        .chat-pane .glass-card { flex: 1; min-height: 0; border: 0; border-radius: 0; box-shadow: none; margin: 0; overflow: hidden; background: #fff; }
        .chat-pane .card-body { display: flex; flex-direction: column; height: 100%; min-height: 0; padding: 0 16px 14px; background: #fff; }
        #chatResponse { flex: 1; height: auto !important; min-height: 0 !important; overflow-y: auto !important; overscroll-behavior: contain; border: 0 !important; background: #fff !important; }
        .chat-composer { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 10px 14px 12px; border-top: 1px solid #e5e7eb; background: #fff; }
        .latency-row { display: flex; flex-wrap: wrap; gap: 5px 14px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.08); color: #64748b; font-size: 0.72rem; }
        .latency-row strong { color: #334155; font-variant-numeric: tabular-nums; }
        .chat-bot p:last-child { margin-bottom: 0; }
        .chat-media { width: 100%; max-height: 320px; margin-top: 8px; border-radius: 6px; background: #000; }
        .tour-qr { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
        .tour-qr img { width: 144px; height: 144px; padding: 6px; border-radius: 4px; background: #fff; }
        .tour-qr a { font-size: 0.85rem; }
        #txtMessage { flex: 1; min-width: 0; height: 42px; min-height: 42px; resize: none; border: 1px solid #d1d5db; border-radius: 999px; font-size: 16px; padding: 8px 16px; overflow: hidden; }
        @media (max-width: 992px) {
            .app-shell { grid-template-rows: minmax(0, 1fr) 64px; }
            .main-layout { grid-template-columns: 1fr; grid-template-rows: minmax(0, 46%) minmax(0, 54%); }
            .avatar-pane, .chat-pane { width: 100%; height: auto; min-width: 0; min-height: 0; }
            .chat-pane { border-left: 0; border-top: 1px solid #e5e7eb; }
            .chat-toolbar { flex-basis: 48px; padding: 0 10px; }
            .avatar-selector { padding-top: 2px; padding-bottom: 2px; }
            .chat-pane .card-body { height: 100%; padding: 0 10px 8px; }
            .chat-composer { gap: 7px; padding: 8px 10px; }
            .btn-danger-custom { padding-left: 10px; padding-right: 10px; }
        }
    </style>
    <style>
        :root {
            --kiosk-ink: #172033;
            --kiosk-muted: #64748b;
            --kiosk-line: #d9e1ec;
            --kiosk-canvas: #f7f9fc;
            --kiosk-brand: #3f63e8;
            --kiosk-brand-dark: #2746bd;
            --kiosk-danger: #df3e48;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { margin: 0; background: #fff; color: var(--kiosk-ink); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        button, select, textarea { font: inherit; }
        button { cursor: pointer; }
        button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(63, 99, 232, 0.28); outline-offset: 2px; }
        #app { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: #fff; }
        .view { position: absolute; inset: 0; min-width: 0; min-height: 0; }
        .view[hidden] { display: none !important; }
        .session-badge, #sessionIdDisplay { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

        #landingView { background: #111827; isolation: isolate; }
        #landingVideo { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; background: #111827; }
        .landing-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8, 12, 20, 0.02) 25%, rgba(8, 12, 20, 0.2) 55%, rgba(8, 12, 20, 0.72) 100%); pointer-events: none; }
        .landing-content { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 0 clamp(24px, 4vh, 44px); text-align: center; color: #fff; }
        .landing-copy { width: min(760px, calc(100% - 32px)); margin: 0 auto 20px; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5); }
        .landing-copy h1 { margin: 0; font-size: clamp(2rem, 3.6vw, 3.5rem); line-height: 1.08; letter-spacing: 0; font-weight: 760; }
        .landing-copy p { margin: 8px 0 0; font-size: clamp(1rem, 1.5vw, 1.28rem); font-weight: 600; }
        .landing-prompts { width: 100%; margin-bottom: 20px; overflow: hidden; mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent); }
        .prompt-row { width: 100%; overflow: hidden; }
        .prompt-row + .prompt-row { margin-top: 9px; }
        .prompt-track { display: flex; width: max-content; will-change: transform; animation: prompt-scroll 20s linear infinite; }
        .prompt-row.reverse .prompt-track { animation-name: prompt-scroll-reverse; animation-duration: 22s; }
        .prompt-group { display: flex; flex: 0 0 auto; gap: 10px; padding-right: 10px; }
        .prompt-chip { flex: 0 0 auto; min-height: 42px; padding: 9px 18px; border: 1px solid rgba(255, 255, 255, 0.32); border-radius: 999px; background: rgba(25, 31, 43, 0.62); color: #fff; font-size: 0.9rem; font-weight: 600; white-space: nowrap; backdrop-filter: blur(10px); box-shadow: 0 5px 16px rgba(0, 0, 0, 0.2); }
        .prompt-chip:hover { background: rgba(39, 49, 68, 0.88); border-color: rgba(255, 255, 255, 0.65); }
        @keyframes prompt-scroll { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
        @keyframes prompt-scroll-reverse { from { transform: translate3d(-50%, 0, 0); } to { transform: translate3d(0, 0, 0); } }
        .landing-actions { display: flex; justify-content: center; }
        .landing-talk { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 238px; min-height: 56px; padding: 0 26px; border: 2px solid rgba(255,255,255,0.88); border-radius: 8px; background: rgba(12, 16, 24, 0.84); color: #fff; box-shadow: 0 10px 26px rgba(0,0,0,0.3); font-weight: 750; transition: background 160ms ease, transform 160ms ease; }
        .landing-talk:hover { background: rgba(25, 33, 48, 0.98); transform: translateY(-1px); }

        #conversationView { background: #fff; }
        .main-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; height: 100%; min-height: 0; overflow: hidden; background: #fff; }
        .avatar-pane { min-width: 0; min-height: 0; overflow: hidden; background: #0d1118; }
        .avatar-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; border-radius: 0; background: #111827 !important; }
        .avatar-end-button { position: absolute; z-index: 4; left: 50%; bottom: 26px; transform: translateX(-50%); display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-width: 188px; min-height: 52px; padding: 0 22px; border: 2px solid #ff5a43; border-radius: 8px; background: rgba(17, 20, 27, 0.88); color: #fff; font-weight: 760; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28); backdrop-filter: blur(8px); }
        .avatar-end-button:hover { background: rgba(35, 39, 49, 0.96); }
        .avatar-end-button i { color: #ff5a43; }
        #offerError { position: absolute; z-index: 3; top: 18px; left: 18px; right: 18px; margin: 0; border-radius: 6px; }
        .chat-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; border-left: 1px solid var(--kiosk-line); background: #fff; }
        .chat-toolbar { flex: 0 0 72px; padding: 0 22px; display: flex; align-items: center; border-bottom: 1px solid var(--kiosk-line); background: #fff; }
        .chat-toolbar h2 { margin: 0; color: var(--kiosk-ink); font-size: 1rem; font-weight: 720; }
        .chat-toolbar p { margin: 4px 0 0; color: var(--kiosk-muted); font-size: 0.78rem; }
        .chat-card { display: flex; flex: 1; min-height: 0; flex-direction: column; }
        #chatResponse { flex: 1; min-height: 0 !important; height: auto !important; overflow-y: auto !important; overscroll-behavior: contain; padding: 18px 20px; border: 0 !important; border-radius: 0; background: var(--kiosk-canvas) !important; }
        .chat-bubble { width: fit-content; max-width: 100%; margin: 0 0 14px; padding: 12px 14px; border-radius: 7px; font-size: 16px; line-height: 1.48; white-space: pre-wrap; word-break: break-word; }
        .chat-user { margin-left: auto; background: var(--kiosk-brand); color: #fff; }
        .chat-bot { position: relative; margin-right: auto; padding-bottom: 10px; background: #e9eef5; color: var(--kiosk-ink); }
        .chat-bot .bubble-content { padding-right: 64px; }
        .chat-bot p:last-child { margin-bottom: 0; }
        .bubble-feedback { position: absolute; right: 9px; bottom: 5px; display: flex; gap: 2px; }
        .bubble-feedback[hidden] { display: none; }
        .feedback-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #315ee8; font-size: 0.96rem; transition: color 140ms ease, background 140ms ease, transform 140ms ease; }
        .feedback-button:hover { background: rgba(49, 94, 232, 0.11); transform: translateY(-1px); }
        .feedback-button.selected { background: #315ee8; color: #fff; }
        .chat-composer { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--kiosk-line); background: #fff; }
        #txtMessage { flex: 1; min-width: 0; min-height: 44px; height: 44px; padding: 10px 14px; resize: none; overflow: hidden; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; color: var(--kiosk-ink); font-size: 16px; }
        #txtMessage::placeholder { color: #94a3b8; }
        #btnMic, .composer-button { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border-radius: 7px; font-size: 1.05rem; }
        #btnMic { border: 0; background: var(--kiosk-brand); color: #fff; }
        #btnMic:hover { background: var(--kiosk-brand-dark); }
        #btnMic.listening { background: var(--kiosk-danger); }
        .btn-danger-custom { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 13px; border: 0; border-radius: 7px; background: var(--kiosk-danger); color: #fff; font-weight: 700; }
        .btn-outline-custom { width: 44px; height: 44px; padding: 0; border: 1px solid #b8c5d9; border-radius: 7px; color: #52627b; background: #fff; }
        .btn-danger-custom:hover { background: #c92f3a; }
        .btn-outline-custom:hover { border-color: var(--kiosk-brand); color: var(--kiosk-brand); }

        .voice-control { flex: 0 0 auto; min-width: 176px; height: 46px; display: inline-flex; align-items: center; justify-content: flex-start; gap: 10px; padding: 0 15px; border: 2px solid var(--kiosk-brand); border-radius: 999px; background: #172033; color: #fff; font-weight: 700; box-shadow: 0 5px 14px rgba(23, 32, 51, 0.2); transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease; }
        #btnMic.voice-control { width: auto; min-width: 176px; height: 46px; padding: 0 15px; border: 2px solid var(--kiosk-brand); border-radius: 999px; background: #172033; }
        #btnMic.voice-control:hover { background: #202b42; }
        .voice-control.recording { border-color: #ff6b35; box-shadow: 0 0 18px rgba(255, 107, 53, 0.38); }
        .voice-control.interrupting { border-color: #f59e0b; box-shadow: 0 0 18px rgba(245, 158, 11, 0.35); }
        .voice-control.processing { cursor: wait; border-color: #94a3b8; opacity: 0.82; box-shadow: none; }
        .voice-control-icon { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; flex: 0 0 auto; }
        .voice-control.recording .voice-control-icon { border-radius: 4px; background: #ff453a; }
        .voice-control.recording .voice-control-icon i { display: none; }
        .voice-control.interrupting .voice-control-icon { border: 3px solid #f59e0b; border-radius: 50%; }
        .voice-control.interrupting .voice-control-icon::before { content: ''; width: 9px; height: 3px; border-radius: 2px; background: #f59e0b; transform: rotate(45deg); }
        .voice-control.interrupting .voice-control-icon i { display: none; }
        .voice-bars { display: none; height: 24px; align-items: center; gap: 3px; }

        #avatarControl > i { font-size: 1rem; }
        #avatarSelect { min-width: 158px; width: auto; padding: 0; border: 0; background: transparent; color: inherit; font-weight: 700; cursor: pointer; box-shadow: none; }

        .latency-row { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 12px; padding: 9px 68px 2px 0; border-top: 1px solid rgba(23, 32, 51, 0.13); color: #64748b; font-size: 0.72rem; }

        .chat-media-frame { aspect-ratio: 16 / 9; max-height: none; }

            #avatarControl { top: 12px !important; right: 12px !important; left: auto !important; }
            #avatarSelect { min-width: 130px; }
            .btn-danger-custom span { display: none; }
            .chat-bubble { font-size: 16px; }
        }

<script>
let pc = null;
let sessionid = null;
let remoteStream = null;
let outputAudioUnlocked = false;
let connecting = false;
let reconnectTimer = null;
let sessionEnded = false;
let sessionWaiters = [];

function updateStatus(connected) {
    const badge = document.getElementById('statusBadge');
    if (connected) {
        badge.className = 'session-badge connected visually-hidden';
        badge.innerHTML = '<span class="status-dot on"></span>Connected';
    } else {
        badge.className = 'session-badge disconnected visually-hidden';
        badge.innerHTML = '<span class="status-dot off"></span>Disconnected';
    }
}

function setSessionId(sid) {
    sessionid = sid;
    document.getElementById('sessionIdDisplay').textContent = 'SID: ' + (sid || '-');
    if (sid) {
        const waiters = sessionWaiters;
        sessionWaiters = [];
        waiters.forEach(resolve => resolve(true));
    }
}

function showError(msg) {
    const el = document.getElementById('offerError');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 8000);
}

function selectedAvatarId() {
    return document.getElementById('avatarSelect')?.value || INITIAL_AVATAR_ID;
}

function avatarPreviewUrl(avatarId) {
    if (window.location.protocol === 'file:') {
        return avatarId === 'ditto_man' ? '../assets/idle.mp4' : '../assets/woman.mp4';
    }
    return '/api/avatar-idle/' + encodeURIComponent(avatarId) + '?v=idle-1';
}

function setPreviewSource(video, sourceUrl) {
    if (!video || video.srcObject) return;
    if (video.dataset.avatarSource === sourceUrl && video.getAttribute('src') === sourceUrl) return;
    video.dataset.avatarSource = sourceUrl;
    video.src = sourceUrl;
    video.loop = true;
    video.muted = true;
    video.load();
    video.play().catch(() => {});
}

function updateLandingSource() {
    const landingVideo = document.getElementById('landingVideo');
    const avatarId = selectedAvatarId();
    const sourceUrl = avatarPreviewUrl(avatarId);
    setPreviewSource(landingVideo, sourceUrl);
    setPreviewSource(document.getElementById('video'), sourceUrl);
}

function enterConversation() {
    sessionEnded = false;
    updateLandingSource();
    const app = document.getElementById('app');
    app.classList.add('conversation-active');
    document.getElementById('landingView').hidden = true;
    document.getElementById('conversationView').hidden = false;
    document.getElementById('video').play().catch(() => {});
}

function ensureSession() {
    if (sessionid) return Promise.resolve(true);
    sessionEnded = false;
    start();
    return new Promise(resolve => sessionWaiters.push(resolve));
}

async function enterConversationAndTalk() {
    enterConversation();
    unlockOutputAudio();
    // ASR does not depend on the avatar session. Start both in parallel so a
    // cold Ditto/WebRTC initialization never blocks microphone capture.
    if (!sessionid) ensureSession();
    if (!micOn) await toggleMic();
}

async function enterConversationWithPrompt(prompt) {
    enterConversation();
    unlockOutputAudio();
    addBubble('user', prompt);
    if (!sessionid && !(await ensureSession())) return;
    await sendText(prompt, false);
}

async function endConversation() {
    stopMic(false);
    await interrupt();
    latencyTurn++;
    speakGen++;
    speakQueue = Promise.resolve();
    const video = document.getElementById('video');
    video.muted = true;
    outputAudioUnlocked = false;
    document.getElementById('chatResponse').replaceChildren();
    document.getElementById('txtMessage').value = '';
    document.getElementById('offerError').style.display = 'none';
    const app = document.getElementById('app');
    app.classList.remove('conversation-active');
    document.getElementById('conversationView').hidden = true;
    document.getElementById('landingView').hidden = false;
    updateLandingSource();
    const landingVideo = document.getElementById('landingVideo');
    landingVideo.currentTime = 0;
    landingVideo.play().catch(() => {});
}

// --- Voice input (browser SpeechRecognition, matching avatar_ui) ---
let speechRecognition = null, speechFinalText = '', speechInterimText = '';
let micCtx = null, micStream = null, micSource = null;
let micAnalyser = null, micVisualFrame = null, micOn = false, micProcessing = false, avatarSpeaking = false;

function resetVoiceBars() {
    document.querySelectorAll('.voice-bar').forEach(bar => { bar.style.height = '4px'; });
}

function stopVoiceVisualization() {
    if (micVisualFrame) cancelAnimationFrame(micVisualFrame);
    micVisualFrame = null;
    micAnalyser = null;
    resetVoiceBars();
}

function drawVoiceBars() {
    if (!micOn || !micAnalyser) return;
    const values = new Uint8Array(micAnalyser.frequencyBinCount);
    micAnalyser.getByteFrequencyData(values);
    const bars = document.querySelectorAll('.voice-bar');
    const step = Math.max(1, Math.floor(values.length / bars.length));
    bars.forEach((bar, index) => {
        const normalized = values[index * step] / 255;
        bar.style.height = `${4 + normalized * 20}px`;
    });
    micVisualFrame = requestAnimationFrame(drawVoiceBars);
}

function renderMicButton() {
    const btn = document.getElementById('btnMic');
    const mode = avatarSpeaking ? 'interrupt' : (micOn ? 'recording' : (micProcessing ? 'processing' : 'idle'));
    const label = mode === 'interrupt' ? 'Interrupt' : (mode === 'recording' ? 'End' : (mode === 'processing' ? 'Processing...' : 'Press to Speak'));
    btn.classList.toggle('recording', mode === 'recording');
    btn.classList.toggle('interrupting', mode === 'interrupt');
    btn.classList.toggle('processing', mode === 'processing');
    btn.disabled = mode === 'processing';
    btn.querySelector('.voice-label').textContent = label;
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.setAttribute('aria-pressed', String(mode !== 'idle'));
    btn.setAttribute('aria-busy', String(mode === 'processing'));
}

async function handleVoiceControl() {
    if (micProcessing) return;
    if (avatarSpeaking) {
        await interrupt();
        avatarSpeaking = false;
        renderMicButton();
        if (!micOn) await toggleMic();
        return;
    }
    await toggleMic();
}

async function toggleMic() {
    unlockOutputAudio();   // this click is a user gesture — unlock avatar audio playback now
    if (micOn) { stopMic(true); return; }
    if (sessionid) interrupt();
    else ensureSession();
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert('Browser speech recognition is not supported. Please use Chrome or Edge.');
        return;
    }
    try {
        micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
        });
    } catch (e) { return alert('Microphone permission denied'); }

    micOn = true;
    micProcessing = false;
    speechFinalText = '';
    speechInterimText = '';
    renderMicButton();
    document.getElementById('txtMessage').placeholder = 'Listening... click mic again to finish';

    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (micCtx.state === 'suspended') await micCtx.resume();
    micSource = micCtx.createMediaStreamSource(micStream);
    micAnalyser = micCtx.createAnalyser();
    micAnalyser.fftSize = 256;
    micSource.connect(micAnalyser);
    drawVoiceBars();

    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    recognition.maxAlternatives = 1;
    recognition.onresult = event => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const text = event.results[i][0].transcript;
            if (event.results[i].isFinal) speechFinalText += `${text} `;
            else interim += text;
        }
        speechInterimText = interim;
        document.getElementById('txtMessage').value = `${speechFinalText}${speechInterimText}`.trim();
    };
    recognition.onerror = event => {
        if (event.error === 'aborted' || event.error === 'no-speech') return;
        console.error('Speech recognition error:', event.error);
        if (micProcessing) finishBrowserRecognition();
    };
    recognition.onend = () => {
        if (micProcessing) {
            finishBrowserRecognition();
        } else if (micOn && speechRecognition === recognition) {
            try { recognition.start(); } catch (error) {
                console.error('Unable to restart speech recognition:', error);
            }
        }
    };
    speechRecognition = recognition;
    recognition.start();
}

function stopMic(sendStop) {
    if (micSource) { micSource.disconnect(); micSource = null; }
    stopVoiceVisualization();
    if (micCtx) { micCtx.close(); micCtx = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    micOn = false;
    if (speechRecognition && sendStop) {
        micProcessing = true;
        try { speechRecognition.stop(); } catch (error) { finishBrowserRecognition(); }
    } else if (speechRecognition) {
        micProcessing = false;
        speechRecognition.onresult = null;
        speechRecognition.onerror = null;
        speechRecognition.onend = null;
        try { speechRecognition.abort(); } catch (error) { /* already stopped */ }
        speechRecognition = null;
        document.getElementById('txtMessage').placeholder = 'Enter a message...';
    }
    renderMicButton();
}

async function finishBrowserRecognition() {
    const recognition = speechRecognition;
    speechRecognition = null;
    if (recognition) {
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
    }
    const clean = `${speechFinalText}${speechInterimText}`.replace(/\s+/g, ' ').trim();
    speechFinalText = '';
    speechInterimText = '';
    micProcessing = false;
    document.getElementById('txtMessage').placeholder = 'Enter a message...';
    renderMicButton();
    if (!clean) {
        document.getElementById('txtMessage').value = '';
        addBubble('bot', '[no speech recognized]');
        return;
    }
    document.getElementById('txtMessage').value = clean;
    if (!sessionid && !(await ensureSession())) return;
    sendText();
}

// --- WebRTC ---
function negotiate(peer) {
    peer.addTransceiver('video', { direction: 'recvonly' });
    peer.addTransceiver('audio', { direction: 'recvonly' });
    return peer.createOffer().then(offer => peer.setLocalDescription(offer)).then(() => {
        return new Promise(resolve => {
            if (peer.iceGatheringState === 'complete') resolve();
            else {
                const check = () => { if (peer.iceGatheringState === 'complete') { peer.removeEventListener('icegatheringstatechange', check); resolve(); } };
                peer.addEventListener('icegatheringstatechange', check);
            }
        });
    }).then(() => {
        const offer = peer.localDescription;
        // Per-avatar voice mapping (ElevenLabs voice IDs; falls back to launch --REF_FILE)
        const AVATAR_VOICE = {
            'ditto_man': 'aSXZu6bgEOS8MXVRzjPi',
            'ditto_woman': 'SEWXl8lPSO01tdGbWECX',
            'avatar_man': 'aSXZu6bgEOS8MXVRzjPi',
            'avatar_woman2': 'SEWXl8lPSO01tdGbWECX',
        };
        const sel = document.getElementById('avatarSelect');
        const chosenAvatar = (sel && sel.value) || undefined;   // per-session avatar from the dropdown
        const body = {
            sdp: offer.sdp,
            type: offer.type,
            avatar: chosenAvatar,
            refaudio: (chosenAvatar && AVATAR_VOICE[chosenAvatar]) || undefined,
        };
        return fetch('/offer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }).then(res => res.json()).then(answer => {
        // Check for server-side error code
        if (answer.code && answer.code !== 0) {
            throw new Error(answer.msg || 'Unknown server error');
        }
        if (!answer.sdp) {
            throw new Error('Server returned no SDP');
        }
        if (answer.sessionid) setSessionId(answer.sessionid);
        return peer.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answer.sdp }));
    }).catch(e => {
        if (pc !== peer) return;
        const msg = e.message || String(e);
        showError(msg);
        // Reset connection state on error
        pc = null;
        connecting = false;
        peer.close();
        updateStatus(false);
        setSessionId(null);
        // always auto-retry (kiosk mode — no connect/disconnect UI)
        scheduleReconnect();
    });
}

function scheduleReconnect(delay = 2000) {
    if (sessionEnded || reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        if (!sessionEnded && (!pc || ['failed', 'closed', 'disconnected'].includes(pc.connectionState))) start();
    }, delay);
}

async function start() {
    if (sessionEnded) return;
    if (connecting || (pc && ['new', 'connecting', 'connected'].includes(pc.connectionState))) return;
    if (pc) { const old = pc; pc = null; old.close(); }
    connecting = true;
    document.getElementById('offerError').style.display = 'none';
    // Fetch ICE servers from backend (Cloudflare TURN, auto-refreshed, never expires)
    let iceServers = [{ urls: 'stun:stun.cloudflare.com:3478' }];
    try {
        const r = await fetch('/api/iceservers');
        const j = await r.json();
        if (j.iceServers && j.iceServers.length) iceServers = j.iceServers;
    } catch (e) { console.warn('iceservers fetch failed, using STUN only', e); }
    const config = { sdpSemantics: 'unified-plan', iceServers };
    const peer = new RTCPeerConnection(config);
    pc = peer;
    const stream = new MediaStream();
    const video = document.getElementById('video');
    peer.addEventListener('track', evt => {
        if (pc !== peer) return;
        if (!stream.getTracks().some(track => track.id === evt.track.id)) {
            stream.addTrack(evt.track);
        }
        remoteStream = stream;
        video.pause();
        video.removeAttribute('src');
        video.srcObject = stream;
        video.loop = false;
        video.muted = !outputAudioUnlocked;
        video.play().catch(() => {});
    });
    peer.addEventListener('connectionstatechange', () => {
        if (pc !== peer) return;
        if (peer.connectionState === 'connected') {
            connecting = false;
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            updateStatus(true);
        } else if (peer.connectionState === 'disconnected') {
            updateStatus(false);
            scheduleReconnect(5000);
        } else if (peer.connectionState === 'failed' || peer.connectionState === 'closed') {
            connecting = false;
            pc = null;
            updateStatus(false);
            setSessionId(null);
            // always auto-reconnect (kiosk mode — no connect/disconnect UI)
            scheduleReconnect();
        }
    });
    negotiate(peer);
}

    const video = document.getElementById('video');
    outputAudioUnlocked = true;
    // Keep the local source-video preview silent. The remote WebRTC stream is
    // unmuted as soon as its first track arrives.
    video.muted = !video.srcObject;
    video.play().catch(() => {});
}

// Send one sentence to the avatar to speak (echo = speak the given text verbatim)
async function speak(text, doInterrupt, pauseMs = 520, final = true) {
    unlockOutputAudio();
    const resp = await fetch('/human', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, type: 'echo', interrupt: doInterrupt, pause_ms: pauseMs, final, sessionid: String(sessionid) }),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || data.code) throw new Error(data.msg || 'avatar speak failed');
}

let speakQueue = Promise.resolve();
let speakGen = 0;   // bumped by interrupt() to cancel sentences queued but not yet sent

function queueSpeak(text, doInterrupt, pauseMs = 520, final = true) {
    const gen = speakGen;
    speakQueue = speakQueue.catch(() => {}).then(() => {
        if (gen !== speakGen) return;   // an interrupt happened → drop this stale queued sentence
        return speak(text, doInterrupt, pauseMs, final);
    });
    return speakQueue;
}

// Where to cut a chunk to send to the avatar. Start speaking ASAP: full-stop
// anywhere, OR a comma/clause once we're past SOFT_MIN, OR a word boundary once a
// run passes HARD_MAX — so a long first sentence doesn't stall the avatar.
function firstSentenceEnd(s) {
    const SOFT_MIN = 20, HARD_MAX = 40;
    let lastSpace = -1;
    let inUrl = false;
    for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (!inUrl && (s.startsWith('https://', i) || s.startsWith('http://', i))) {
            inUrl = true;
        }
        if (inUrl) {
            if (/\s/.test(c)) inUrl = false;
            continue;
        }
        if ('!?。！？\n'.includes(c)) return i;                                   // strong sentence end
        if (c === '.' && i + 1 < s.length && /\s/.test(s[i + 1])) return i;       // period + space
        if (i >= SOFT_MIN && ',，、;；:：'.includes(c)) return i;                   // long clause → break at comma
        if (c === ' ') lastSpace = i;
        if (i >= HARD_MAX && lastSpace >= SOFT_MIN) return lastSpace;             // very long run → word boundary
    }
    return -1;
}

// Split only at semantic boundaries. Comma-sized chunks made ElevenLabs reset
// prosody and forced Ditto to repeatedly restart its speech motion.
function semanticBoundary(s, force = false) {
    let inUrl = false;
    for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (!inUrl && (s.startsWith('https://', i) || s.startsWith('http://', i))) inUrl = true;
        if (inUrl) {
            if (/\s/.test(c)) inUrl = false;
            continue;
        }
        const priorToken = s.slice(0, i).match(/([A-Za-z.]{1,12})$/);
        const abbreviation = priorToken && [
            'e.g', 'i.e', 'etc', 'vs', 'excl', 'incl', 'approx', 'no',
            'mr', 'mrs', 'ms', 'dr', 'prof', 'sr', 'jr', 'st'
        ].includes(priorToken[1].toLowerCase());
        const isPeriod = c === '.' && !abbreviation &&
            (i + 1 >= s.length || /\s/.test(s[i + 1]));
        if ('!?\u3002\uff01\uff1f'.includes(c) || isPeriod) {
            if (i + 1 >= s.length && !force) return null;
            const paragraph = s.slice(i + 1).match(/^[ \t]*\r?\n[ \t]*\r?\n/);
            return { end: i + 1 + (paragraph ? paragraph[0].length : 0), pauseMs: paragraph ? 900 : 520 };
        }
        if (c === ':' && (i + 1 < s.length || force)) {
            const listStart = s.slice(i + 1).match(/^[ \t]*\r?\n/);
            if (listStart) return { end: i + 1 + listStart[0].length, pauseMs: 800 };
        }
        // A list item is a real semantic boundary. Consume the separator so
        // names such as "The Meeting Point" can never be split by length.
        if (i > 0 && s.startsWith(' - ', i)) {
            return { end: i + 3, pauseMs: 280 };
        }
    }
    return force && s.trim() ? { end: s.length, pauseMs: 520 } : null;
}

function addBubble(who, text) {
    const out = document.getElementById('chatResponse');
    const div = document.createElement('div');
    div.className = 'chat-bubble ' + (who === 'user' ? 'chat-user' : 'chat-bot');
    if (who === 'user') {
        div.textContent = text;
    } else {
        const content = document.createElement('div');
        content.className = 'bubble-content';
        content.textContent = text;
        div.appendChild(content);
        const feedback = document.createElement('div');
        feedback.className = 'bubble-feedback';
        feedback.hidden = true;
        feedback.setAttribute('role', 'group');
        feedback.setAttribute('aria-label', 'Rate this response');
        feedback.innerHTML = '<button class="feedback-button" type="button" data-feedback="up" title="Helpful" aria-label="Helpful" aria-pressed="false"><i class="bi bi-hand-thumbs-up-fill" aria-hidden="true"></i></button>' +
            '<button class="feedback-button" type="button" data-feedback="down" title="Not helpful" aria-label="Not helpful" aria-pressed="false"><i class="bi bi-hand-thumbs-down-fill" aria-hidden="true"></i></button>';
        feedback.addEventListener('click', event => {
            const button = event.target.closest('.feedback-button');
            if (!button) return;
            const selected = button.classList.contains('selected');
            feedback.querySelectorAll('.feedback-button').forEach(item => {
                item.classList.remove('selected');
                item.setAttribute('aria-pressed', 'false');
            });
            if (!selected) {
                button.classList.add('selected');
                button.setAttribute('aria-pressed', 'true');
            }
        });
        div.appendChild(feedback);
    }
    out.appendChild(div);
    out.scrollTop = out.scrollHeight;
    return div;
}

const VIDEO_URL_RE = /`?(https?:\/\/[^\s`<>"']+?\.(?:mp4|mov|webm)(?:\?[^\s`<>"']*)?)`?/gi;
const CHAT_URL_RE = /`?((?:https?:\/\/|www\.)[^\s`<>"')]+)`?/gi;

function normalizeExternalUrl(url) {
    return /^https?:\/\//i.test(url) ? url : 'https://' + url;
}

function splitTrailingUrlPunctuation(rawUrl) {
    let url = rawUrl;
    let trailing = '';
    while (url && /[.,;:!?]/.test(url[url.length - 1])) {
        trailing = url[url.length - 1] + trailing;
        url = url.slice(0, -1);
    }
    return { url, trailing };
}

function youtubeEmbedUrl(url) {
    try {
        const parsed = new URL(normalizeExternalUrl(url));
        const host = parsed.hostname.replace(/^www\./i, '').toLowerCase();
        let id = '';
        if (host === 'youtu.be') id = parsed.pathname.split('/').filter(Boolean)[0] || '';
        else if (host === 'youtube.com' || host.endsWith('.youtube.com')) {
            if (parsed.pathname.startsWith('/embed/')) id = parsed.pathname.split('/')[2] || '';
            else if (parsed.pathname.startsWith('/shorts/')) id = parsed.pathname.split('/')[2] || '';
            else id = parsed.searchParams.get('v') || '';
        }
        return /^[A-Za-z0-9_-]{11}$/.test(id)
            ? 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0'
            : null;
    } catch (_) {
        return null;
    }
}

function isDirectVideo(url) {
    return /\.(?:mp4|mov|webm)(?:\?[^\s`<>"']*)?$/i.test(url);
}

function createLinkQr(url) {
    const href = normalizeExternalUrl(url);
    const wrap = document.createElement('div');
    wrap.className = 'link-qr';
    const qr = document.createElement('img');
    qr.alt = 'QR code';
    qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&format=svg&data=' + encodeURIComponent(href);
    wrap.append(qr);
    return wrap;
}

function renderBotBubble(el, text) {
    const content = el.querySelector('.bubble-content') || el;
    const feedback = el.querySelector('.bubble-feedback');
    if (feedback) feedback.hidden = !text.trim();
    const appendMarkdown = markdown => {
        if (!markdown) return;
        if (!window.marked || !window.DOMPurify) {
            content.appendChild(document.createTextNode(markdown));
            return;
        }
        const template = document.createElement('template');
        template.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
        content.appendChild(template.content);
    };
    content.replaceChildren();
    // Preserve a Markdown link's human label, but route its URL through the
    // same embedded-media/QR rendering path as a plain URL.
    text = text.replace(/\[([^\]]+)\]\(\s*((?:https?:\/\/|www\.)[^\s)]+)\s*\)/gi, '$1 $2');
    let offset = 0;
    for (const match of text.matchAll(CHAT_URL_RE)) {
        appendMarkdown(text.slice(offset, match.index));
        const split = splitTrailingUrlPunctuation(match[1]);
        const url = normalizeExternalUrl(split.url);
        const youtube = youtubeEmbedUrl(url);
        if (youtube) {
            const frame = document.createElement('iframe');
            frame.className = 'chat-media-frame';
            frame.src = youtube;
            frame.title = 'YouTube video';
            frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            frame.allowFullscreen = true;
            frame.referrerPolicy = 'strict-origin-when-cross-origin';
            content.appendChild(frame);
        } else if (isDirectVideo(url)) {
            const video = document.createElement('video');
            video.className = 'chat-media';
            video.controls = true;
            video.playsInline = true;
            video.preload = 'metadata';
            video.src = url;
            content.appendChild(video);
        }
        if (!youtube) content.appendChild(createLinkQr(url));
        appendMarkdown(split.trailing);
        offset = match.index + match[0].length;
    }
    appendMarkdown(text.slice(offset));
}

function toSpeechText(text) {
    return text
        .replace(/^\s*-\s*/, '')
        .replace(/\s+-\s*$/, '')
        .replace(/(?:📹\s*)?Video Walkthrough\s*:/gi, ' ')
        .replace(/(?:🗺️?\s*)?Interactive 360°?\s*Tour(?:\s*\(powered by Airsquire\))?\s*:/gi, ' ')
        .replace(VIDEO_URL_RE, ' ')
        .replace(/!?\[([^\]]*)\]\(https?:\/\/[^)]+\)/g, '$1')
        .replace(/(?:https?:\/\/|www\.)\S+/g, ' ')
        .replace(/\b(?:id|token|share)=[A-Za-z0-9_-]+/gi, ' ')
        .replace(/[*#_`>~]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
}

function addLatencyRow(bubble) {
    const row = document.createElement('div');
    row.className = 'latency-row';
    row.hidden = true;
    row.setAttribute('aria-live', 'polite');
    row.innerHTML = '<span hidden>First character: <strong></strong></span>' +
        '<span hidden>First TTS: <strong></strong></span>' +
        '<span hidden>Complete response: <strong></strong></span>' +
        '<span hidden>Avatar started: <strong></strong></span>';
    const feedback = bubble.querySelector('.bubble-feedback');
    bubble.insertBefore(row, feedback || null);
    const values = row.querySelectorAll('strong');
    return { firstChar: values[0], firstTts: values[1], complete: values[2], avatar: values[3] };
}

function setLatency(el, startedAt, name) {
    const seconds = (performance.now() - startedAt) / 1000;
    const value = seconds.toFixed(2) + 's';
    el.textContent = value;
    el.parentElement.hidden = false;
    el.closest('.latency-row').hidden = false;
    console.info('[latency]', name, value);
}

async function getAvatarTiming() {
    const resp = await fetch('/avatar_timing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionid: String(sessionid) }),
    });
    const data = await resp.json();
    return data.code === 0 ? data.data : { tts_seq: 0, avatar_seq: 0 };
}

let latencyTurn = 0;
async function watchAvatarTiming(startedAt, turn, metrics, baseline) {
    const deadline = performance.now() + 60000;
    let gotTts = false, gotAvatar = false;
    while (turn === latencyTurn && performance.now() < deadline && (!gotTts || !gotAvatar)) {
        try {
            const timing = await getAvatarTiming();
            if (!gotTts && timing.tts_seq > baseline.tts_seq) {
                gotTts = true;
                setLatency(metrics.firstTts, startedAt, 'firstTts');
            }
            if (!gotAvatar && timing.avatar_seq > baseline.avatar_seq) {
                gotAvatar = true;
                setLatency(metrics.avatar, startedAt, 'avatarStarted');
            }
        } catch (e) { /* retry until timeout */ }
        await new Promise(resolve => setTimeout(resolve, 25));
    }
}

async function sendText(textOverride = null, showUserBubble = true) {
    unlockOutputAudio();
    const el = document.getElementById('txtMessage');
    const out = document.getElementById('chatResponse');
    const text = (textOverride == null ? el.value : textOverride).trim();
    const mode = document.getElementById('txtType').value;
    if (!text) return;
    if (!sessionid && !(await ensureSession())) return;
    const startedAt = performance.now();
    const turn = ++latencyTurn;
    el.value = '';

    if (showUserBubble) addBubble('user', text);

    if (mode === 'echo') {
        const botBubble = addBubble('bot', 'Echo');
        const metrics = addLatencyRow(botBubble);
        metrics.firstChar.textContent = 'n/a';
        metrics.complete.textContent = 'n/a';
        await interrupt();
        watchAvatarTiming(startedAt, turn, metrics, { tts_seq: 0, avatar_seq: 0 });
        await queueSpeak(text, false, 300, true);     // just speak what was typed
        return;
    }

    // chat: stream text on screen AND speak each sentence the moment it completes,
    // so the avatar starts on sentence 1 instead of waiting for the whole reply.
    const botBubble = addBubble('bot', '');
    const metrics = addLatencyRow(botBubble);
    const interruptPromise = interrupt();  // stop speech while the chat request starts in parallel
    speakQueue = interruptPromise.catch(() => {});
    interruptPromise.then(() => {
        watchAvatarTiming(startedAt, turn, metrics, { tts_seq: 0, avatar_seq: 0 });
    });
    let reply = '', spoken = 0, gotFirstCharacter = false;
    const flushSentences = (force) => {
        for (;;) {
            const rest = reply.slice(spoken);
            const boundary = semanticBoundary(rest, force);
            if (!boundary) break;
            const s = toSpeechText(rest.slice(0, boundary.end));
            spoken += boundary.end;
            if (s) queueSpeak(s, false, boundary.pauseMs, false);
        }
        if (force) {
            const tail = toSpeechText(reply.slice(spoken));
            if (tail) queueSpeak(tail, false, 280, false);
            spoken = reply.length;
            // Every completed sentence already carries its semantic pause.
            // The empty final marker only flushes Ditto's remaining model tail.
            queueSpeak('', false, 20, true);
        }
    };
    try {
        const resp = await fetch(CHAT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: text,
                session_id: String(sessionid),
                agent_id: CHAT_AGENT_ID,
            }),
        });
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let sse = '', done = false;
        while (!done) {
            const r = await reader.read();
            if (r.done) break;
            sse += dec.decode(r.value, { stream: true });
            let nl;
            while ((nl = sse.indexOf('\n')) >= 0) {
                const line = sse.slice(0, nl).trim(); sse = sse.slice(nl + 1);
                if (!line.startsWith('data:')) continue;
                let obj; try { obj = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
                const chunk = obj.data || '';
                if (chunk) {
                    if (!gotFirstCharacter) {
                        gotFirstCharacter = true;
                        setLatency(metrics.firstChar, startedAt, 'firstCharacter');
                    }
                    reply += chunk;
                    renderBotBubble(botBubble, reply);
                    out.scrollTop = out.scrollHeight;
                    flushSentences(false);            // speak completed sentences immediately
                }
                if (obj.final_token) { done = true; break; }
            }
        }
        flushSentences(true);                         // speak the final partial sentence
        setLatency(metrics.complete, startedAt, 'completeResponse');
    } catch (e) {
        reply += '\n[error: ' + (e.message || e) + ']';
        renderBotBubble(botBubble, reply);
    }
}

// --- Interrupt ---
function interrupt() {
    speakGen++;                            // invalidate every sentence still queued in the frontend
    speakQueue = Promise.resolve();
    avatarSpeaking = false;
    renderMicButton();
    if (!sessionid) return Promise.resolve();
    return fetch('/interrupt_talk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionid: String(sessionid) }),
    }).then(r => r.json()).then(d => console.log('interrupt:', d)).catch(() => {});
}

// --- Speaking Status ---
function checkSpeaking() {
    if (!sessionid) return alert('Please connect WebRTC first');
    fetch('/is_speaking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionid: String(sessionid) }),
    }).then(r => r.json()).then(d => alert('Speaking: ' + JSON.stringify(d.data)));
}

// Populate the avatar switcher from the backend with user-facing names.
async function loadAvatarList() {
    const sel = document.getElementById('avatarSelect');
    if (!sel) return;
    try {
        const j = await fetch('/api/avatars').then(r => r.json());
        const avatars = (j.data && j.data.avatars) || [];
        let def = '';
        try {
            const c = await fetch('/api/admin/config').then(r => r.json());
            def = (c.data && c.data.config && c.data.config.avatar_id) || '';
        } catch (e) { /* config endpoint optional */ }
        const preferred = avatars.includes(INITIAL_AVATAR_ID)
            ? INITIAL_AVATAR_ID
            : (avatars.includes(def) ? def : (avatars[0] || ''));
        sel.innerHTML = '';
        avatars.forEach(id => {
            const o = document.createElement('option');
            o.value = id;
            o.textContent = id.replace(/^ditto_/, 'avatar_');
            if (id === preferred) o.selected = true;
            sel.appendChild(o);
        });
        updateLandingSource();
    } catch (e) { console.warn('avatar list failed', e); }
}

async function syncAvatarSpeaking() {
    if (!sessionid) {
        if (avatarSpeaking) {
            avatarSpeaking = false;
            renderMicButton();
        }
        return;
    }
    try {
        const response = await fetch('/is_speaking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionid: String(sessionid) }),
        });
        const payload = await response.json();
        const speaking = response.ok && payload.code === 0 && Boolean(payload.data);
        if (speaking !== avatarSpeaking) {
            avatarSpeaking = speaking;
            renderMicButton();
        }
    } catch (error) { /* reconnect loop owns transport errors */ }
}

setInterval(syncAvatarSpeaking, 250);

// Switch avatar live — no backend restart. Reconnect with the chosen avatar;
// build_avatar_session loads it on the backend for this session (+ its voice).
async function switchAvatar() {
    interrupt();
    if (pc) { pc.close(); pc = null; }
    connecting = false;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    setSessionId(null);
    document.getElementById('video').srcObject = null;
    remoteStream = null;
    updateLandingSource();
    await start();   // start()/negotiate() reads #avatarSelect
}

// Select the preferred avatar before negotiating. Running these concurrently
// could create a woman session first and only change the dropdown to man later.
loadAvatarList().finally(() => start());

</script>
